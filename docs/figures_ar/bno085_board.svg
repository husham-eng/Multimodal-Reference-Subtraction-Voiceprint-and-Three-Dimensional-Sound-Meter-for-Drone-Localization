ircle cx="480.0" cy="270" r="13" fill="#c9a227" stroke="#7a5d00" stroke-width="2"/><circle cx="480.0" cy="270" r="6" fill="#3e2723" stroke="none" stroke-width="1"/><text x="480.0" y="306" font-size="14" fill="#d62728" text-anchor="middle" font-weight="bold">P0</text><polyline points="480.0,257 480.0,163" fill="none" stroke="#d62728" stroke-width="3" stroke-linejoin="round"/><text x="480.0" y="120" font-size="15" fill="#d62728" text-anchor="middle" font-weight="bold">P0</text><text x="480.0" y="140" font-size="13" fill="#d62728" text-anchor="middle" direction="rtl" unicode-bidi="embed">إلى 3V3 (مع VIN)</text><circle cx="540.0" cy="270" r="13" fill="#c9a227" stroke="#7a5d00" stroke-width="2"/><circle cx="540.0" cy="270" r="6" fill="#3e2723" stroke="none" stroke-width="1"/><text x="540.0" y="306" font-size="14" fill="#bbb" text-anchor="middle">P1</text><circle cx="600.0" cy="270" r="13" fill="#c9a227" stroke="#7a5d00" stroke-width="2"/><circle cx="600.0" cy="270" r="6" fill="#3e2723" stroke="none" stroke-width="1"/><text x="600.0" y="306" font-size="14" fill="#bbb" text-anchor="middle">RST</text><circle cx="660.0" cy="270" r="13" fill="#c9a227" stroke="#7a5d00" stroke-width="2"/><circle cx="660.0" cy="270" r="6" fill="#3e2723" stroke="none" stroke-width="1"/><text x="660.0" y="306" font-size="14" fill="#bbb" text-anchor="middle">DI</text><circle cx="720.0" cy="270" r="13" fill="#c9a227" stroke="#7a5d00" stroke-width="2"/><circle cx="720.0" cy="270" r="6" fill="#3e2723" stroke="none" stroke-width="1"/><text x="720.0" y="306" font-size="14" fill="#bbb" text-anchor="middle">CS</text><circle cx="420.0" cy="560" r="13" fill="#c9a227" stroke="#7a5d00" stroke-width="2"/><circle cx="420.0" cy="560" r="6" fill="#3e2723" stroke="none" stroke-width="1"/><text x="420.0" y="536" font-size="14" fill="#d62728" text-anchor="middle" font-weight="bold">VIN</text><polyline points="420.0,573 420.0,676" fill="none" stroke="#d62728" stroke-width="3" stroke-linejoin="round"/><text x="420.0" y="700" font-size="15" fill="#d62728" text-anchor="middle" font-weight="bold">VIN</text><text x="420.0" y="720" font-size="13" fill="#d62728" text-anchor="middle" direction="rtl" unicode-bidi="embed">الطرف 1 (3V3)</text><circle cx="480.0" cy="560" r="13" fill="#c9a227" stroke="#7a5d00" stroke-width="2"/><circle cx="480.0" cy="560" r="6" fill="#3e2723" stroke="none" stroke-width="1"/><text x="480.0" y="536" font-size="14" fill="#bbb" text-anchor="middle">3Vo</text><circle cx="540.0" cy="560" r="13" fill="#c9a227" stroke="#7a5d00" stroke-width="2"/><circle cx="540.0" cy="560" r="6" fill="#3e2723" stroke="none" stroke-width="1"/><text x="540.0" y="536" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">GND</text><polyline points="540.0,573 540.0,676" fill="none" stroke="#9e9e9e" stroke-width="3" stroke-linejoin="round"/><text x="540.0" y="700" font-size="15" fill="#222" text-anchor="middle" font-weight="bold">GND</text><text x="540.0" y="720" font-size="13" fill="#222" text-anchor="middle" direction="rtl" unicode-bidi="embed">الطرف 6 (GND)</text><circle cx="600.0" cy="560" r="13" fill="#c9a227" stroke="#7a5d00" stroke-width="2"/><circle cx="600.0" cy="560" r="6" fill="#3e2723" stroke="none" stroke-width="1"/><text x="600.0" y="536" font-size="14" fill="#bbb" text-anchor="middle">SCL</text><circle cx="660.0" cy="560" r="13" fill="#c9a227" stroke="#7a5d00" stroke-width="2"/><circle cx="660.0" cy="560" r="6" fill="#3e2723" stroke="none" stroke-width="1"/><text x="660.0" y="536" font-size="14" fill="#ff8c00" text-anchor="middle" font-weight="bold">SDA</text><polyline points="660.0,573 660.0,676" fill="none" stroke="#ff8c00" stroke-width="3" stroke-linejoin="round"/><text x="660.0" y="700" font-size="15" fill="#ff8c00" text-anchor="middle" font-weight="bold">SDA</text><text x="660.0" y="720" font-size="13" fill="#ff8c00" text-anchor="middle" direction="rtl" unicode-bidi="embed">الطرف 10 (RXD)</text><circle cx="720.0" cy="560" r="13" fill="#c9a227" stroke="#7a5d00" stroke-width="2"/><circle cx="720.0" cy="560" r="6" fill="#3e2723" stroke="none" stroke-width="1"/><text x="720.0" y="536" font-size="14" fill="#bbb" text-anchor="middle">INT</text><text x="1470" y="150" font-size="15" fill="#222" text-anchor="start" font-weight="bold" direction="rtl" unicode-bidi="embed">الأطراف المستخدمة (4 فقط):</text><text x="1470" y="182" font-size="15" fill="#d62728" text-anchor="start" font-weight="bold" direction="rtl" unicode-bidi="embed">VIN ← الطرف 1 في الباي (3V3)</text><text x="1470" y="214" font-size="15" fill="#222" text-anchor="start" font-weight="bold" direction="rtl" unicode-bidi="embed">GND ← الطرف 6 في الباي (GND)</text><text x="1470" y="246" font-size="15" fill="#ff8c00" text-anchor="start" font-weight="bold" direction="rtl" unicode-bidi="embed">SDA ← الطرف 10 في الباي (GPIO15 RXD)</text><text x="1470" y="278" font-size="15" fill="#d62728" text-anchor="start" font-weight="bold" direction="rtl" unicode-bidi="embed">P0 ← 3V3 (يختار نمط UART-RVC)</text><text x="1470" y="310" font-size="15" fill="#222" text-anchor="end"></text><text x="1470" y="342" font-size="15" fill="#8a8a8a" text-anchor="start" font-weight="bold" direction="rtl" unicode-bidi="embed">باقي الأطراف تبقى فارغة:</text><text x="1470" y="374" font-size="15" fill="#8a8a8a" text-anchor="end">3Vo · SCL · INT · BT · P1 · RST · DI · CS</text><text x="1470" y="406" font-size="15" fill="#222" text-anchor="end"></text><text x="1470" y="438" font-size="15" fill="#222" text-anchor="start" direction="rtl" unicode-bidi="embed">في نمط UART-RVC يرسل BNO085 الاتجاه الجاهز</text><text x="1470" y="470" font-size="15" fill="#222" text-anchor="start" direction="rtl" unicode-bidi="embed">(yaw/pitch/roll) 100 مرة/ثانية على طرف SDA.</text><text x="1470" y="502" font-size="15" fill="#8a8a8a" text-anchor="start" direction="rtl" unicode-bidi="embed">تأكد من ذلك ومن P0 في دليل Adafruit للوحة 4754.</text><text x="1470" y="534" font-size="15" fill="#222" text-anchor="end"></text><text x="1470" y="566" font-size="15" fill="#222" text-anchor="start" font-weight="bold" direction="rtl" unicode-bidi="embed">قبل التشغيل: فعّل المنفذ التسلسلي في الباي:</text><text x="1470" y="598" font-size="15" fill="#222" text-anchor="end">sudo raspi-config ← Interface ← Serial Port</text><text x="1470" y="630" font-size="15" fill="#222" text-anchor="start" direction="rtl" unicode-bidi="embed">login shell: No · hardware: Yes ← ثم أعد التشغيل</text><text x="750" y="815" font-size="16" fill="#222" text-anchor="middle" direction="rtl" unicode-bidi="embed">ثبّت اللوحة بإحكام على الكرة، ومحاورها موازية لمحاور الميكروفونات (x للأمام، y لليسار، z للأعلى).</text></svg>