points="20,695 40,695" fill="none" stroke="#222" stroke-width="2.6" stroke-linejoin="round" stroke-dasharray="8,5"/><circle cx="20" cy="695" r="4" fill="#222" stroke="none" stroke-width="1"/><text x="640" y="870" font-size="14" fill="#222" text-anchor="middle" font-weight="bold" direction="rtl" unicode-bidi="embed">أرضي مشترك: أي طرف GND في البيكو 2 (هنا الطرف 38، أو الطرف 23) ← أرضي المزوّدين</text><text x="1780" y="915" font-size="14" fill="#222" text-anchor="start" direction="rtl" unicode-bidi="embed">• كل سيرفو له 3 أسلاك: البرتقالي = الإشارة إلى البيكو، والأحمر = +5V من مزوّد رأسه، والبني = GND.</text><text x="1780" y="943" font-size="14" fill="#d62728" text-anchor="start" font-weight="bold" direction="rtl" unicode-bidi="embed">• لا يوصل الأحمر بالبيكو أبداً. ولكل رأس مزوّده، وأرضيّ المزوّدين موصولان بأرضي البيكو 2.</text><text x="1780" y="971" font-size="14" fill="#8a8a8a" text-anchor="start" direction="rtl" unicode-bidi="embed">• الخطوط المتقاطعة دون نقطة غير موصولة. البيكو مرسوم مقلوباً فقط لتوضيح الرسم.</text></svg>