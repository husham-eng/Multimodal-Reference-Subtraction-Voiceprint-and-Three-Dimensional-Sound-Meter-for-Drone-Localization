<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720" font-family="DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fff"/><text x="750" y="48" font-size="30" fill="#222" text-anchor="middle" font-weight="bold" direction="rtl" unicode-bidi="embed">لوحة MPU-6050 (GY-521): كيف تبدو وما أطرافها</text><text x="750" y="82" font-size="17" fill="#8a8a8a" text-anchor="middle">Illustration (not a photo) – about 21 x 16 mm, blue board, 8 pins in one row</text><rect x="400" y="140" width="420" height="320" rx="10" fill="#1565c0" stroke="#0d3c78" stroke-width="2.5"/><circle cx="430" cy="170" r="15" fill="#fff" stroke="#c0a060" stroke-width="4"/><circle cx="790" cy="170" r="15" fill="#fff" stroke="#c0a060" stroke-width="4"/><rect x="570.0" y="235" width="80" height="80" rx="4" fill="#222" stroke="#000" stroke-width="1.6"/><circle cx="580.0" cy="245" r="3.5" fill="#666" stroke="none" stroke-width="1"/><text x="610.0" y="282" font-size="12" fill="#ddd" text-anchor="middle" font-weight="bold">MPU-6050</text><rect x="440" y="245" width="50" height="34" rx="2" fill="#333" stroke="#000" stroke-width="1.6"/><text x="465" y="267" font-size="10" fill="#ccc" text-anchor="middle">LDO</text><rect x="740" y="250" width="20" height="12" rx="2" fill="#e53935" stroke="#600" stroke-width="1.6"/><text x="750" y="280" font-size="10" fill="#fff" text-anchor="middle">LED</text><text x="610.0" y="210" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold">GY-521</text><polyline points="725,320 780,320" fill="none" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/><polygon points="782,320 772.9955289764732,324.3496553411123 772.9955289764732,315.6503446588877" fill="#fff"/><text x="795" y="325" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">X</text><polyline points="725,320 725,265" fill="none" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/><polygon points="725,263 729.3496553411123,272.0044710235268 720.6503446588877,272.0044710235268" fill="#fff"/><text x="725" y="256" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">Y</text><rect x="417.25" y="426" width="18" height="18" rx="3" fill="#d4af37" stroke="#8a6d00" stroke-width="1.6"/><circle cx="426.25" cy="435" r="4.5" fill="#5d4037" stroke="none" stroke-width="1"/><text x="426.25" y="414" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">VCC</text><polyline points="426.25,460 426.25,500" fill="none" stroke="#d62728" stroke-width="3" stroke-linejoin="round"/><text x="426.25" y="524" font-size="15" fill="#d62728" text-anchor="middle" font-weight="bold">VCC</text><text x="426.25" y="544" font-size="12" fill="#d62728" text-anchor="middle" direction="rtl" unicode-bidi="embed">الطرف 17 (3V3)</text><rect x="469.75" y="426" width="18" height="18" rx="3" fill="#d4af37" stroke="#8a6d00" stroke-width="1.6"/><circle cx="478.75" cy="435" r="4.5" fill="#5d4037" stroke="none" stroke-width="1"/><text x="478.75" y="414" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">GND</text><polyline points="478.75,460 478.75,546" fill="none" stroke="#222" stroke-width="3" stroke-linejoin="round"/><text x="478.75" y="570" font-size="15" fill="#222" text-anchor="middle" font-weight="bold">GND</text><text x="478.75" y="590" font-size="12" fill="#222" text-anchor="middle" direction="rtl" unicode-bidi="embed">الطرف 9 (GND)</text><rect x="522.25" y="426" width="18" height="18" rx="3" fill="#d4af37" stroke="#8a6d00" stroke-width="1.6"/><circle cx="531.25" cy="435" r="4.5" fill="#5d4037" stroke="none" stroke-width="1"/><text x="531.25" y="414" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">SCL</text><polyline points="531.25,460 531.25,500" fill="none" stroke="#7b1fa2" stroke-width="3" stroke-linejoin="round"/><text x="531.25" y="524" font-size="15" fill="#7b1fa2" text-anchor="middle" font-weight="bold">SCL</text><text x="531.25" y="544" font-size="12" fill="#7b1fa2" text-anchor="middle" direction="rtl" unicode-bidi="embed">الطرف 5 (SCL)</text><rect x="574.75" y="426" width="18" height="18" rx="3" fill="#d4af37" stroke="#8a6d00" stroke-width="1.6"/><circle cx="583.75" cy="435" r="4.5" fill="#5d4037" stroke="none" stroke-width="1"/><text x="583.75" y="414" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">SDA</text><polyline points="583.75,460 583.75,546" fill="none" stroke="#1f6fd1" stroke-width="3" stroke-linejoin="round"/><text x="583.75" y="570" font-size="15" fill="#1f6fd1" text-anchor="middle" font-weight="bold">SDA</text><text x="583.75" y="590" font-size="12" fill="#1f6fd1" text-anchor="middle" direction="rtl" unicode-bidi="embed">الطرف 3 (SDA)</text><rect x="627.25" y="426" width="18" height="18" rx="3" fill="#d4af37" stroke="#8a6d00" stroke-width="1.6"/><circle cx="636.25" cy="435" r="4.5" fill="#5d4037" stroke="none" stroke-width="1"/><text x="636.25" y="414" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">XDA</text><polyline points="636.25,460 636.25,500" fill="none" stroke="#8a8a8a" stroke-width="3" stroke-linejoin="round"/><text x="636.25" y="524" font-size="15" fill="#8a8a8a" text-anchor="middle" font-weight="bold">XDA</text><text x="636.25" y="544" font-size="12" fill="#8a8a8a" text-anchor="middle" direction="rtl" unicode-bidi="embed">لا يوصل</text><rect x="679.75" y="426" width="18" height="18" rx="3" fill="#d4af37" stroke="#8a6d00" stroke-width="1.6"/><circle cx="688.75" cy="435" r="4.5" fill="#5d4037" stroke="none" stroke-width="1"/><text x="688.75" y="414" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">XCL</text><polyline points="688.75,460 688.75,546" fill="none" stroke="#8a8a8a" stroke-width="3" stroke-linejoin="round"/><text x="688.75" y="570" font-size="15" fill="#8a8a8a" text-anchor="middle" font-weight="bold">XCL</text><text x="688.75" y="590" font-size="12" fill="#8a8a8a" text-anchor="middle" direction="rtl" unicode-bidi="embed">لا يوصل</text><rect x="732.25" y="426" width="18" height="18" rx="3" fill="#d4af37" stroke="#8a6d00" stroke-width="1.6"/><circle cx="741.25" cy="435" r="4.5" fill="#5d4037" stroke="none" stroke-width="1"/><text x="741.25" y="414" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">AD0</text><polyline points="741.25,460 741.25,500" fill="none" stroke="#222" stroke-width="3" stroke-linejoin="round"/><text x="741.25" y="524" font-size="15" fill="#222" text-anchor="middle" font-weight="bold">AD0</text><text x="741.25" y="544" font-size="12" fill="#222" text-anchor="middle" direction="rtl" unicode-bidi="embed">GND (أو يُترك)</text><rect x="784.75" y="426" width="18" height="18" rx="3" fill="#d4af37" stroke="#8a6d00" stroke-width="1.6"/><circle cx="793.75" cy="435" r="4.5" fill="#5d4037" stroke="none" stroke-width="1"/><text x="793.75" y="414" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">INT</text><polyline points="793.75,460 793.75,546" fill="none" stroke="#8a8a8a" stroke-width="3" stroke-linejoin="round"/><text x="793.75" y="570" font-size="15" fill="#8a8a8a" text-anchor="middle" font-weight="bold">INT</text><text x="793.75" y="590" font-size="12" fill="#8a8a8a" text-anchor="middle" direction="rtl" unicode-bidi="embed">لا يوصل</text><text x="1460" y="160" font-size="16" fill="#222" text-anchor="start" font-weight="bold" direction="rtl" unicode-bidi="embed">كيف تميّزها:</text><text x="1460" y="192" font-size="16" fill="#222" text-anchor="start" direction="rtl" unicode-bidi="embed">• لوحة زرقاء صغيرة مكتوب عليها GY-521</text><text x="1460" y="224" font-size="16" fill="#222" text-anchor="start" direction="rtl" unicode-bidi="embed">• شريحة سوداء مربعة صغيرة في الوسط (MPU-6050)</text><text x="1460" y="256" font-size="16" fill="#222" text-anchor="start" direction="rtl" unicode-bidi="embed">• صف واحد من 8 أطراف</text><text x="1460" y="288" font-size="16" fill="#222" text-anchor="start" direction="rtl" unicode-bidi="embed">• سهمان X وY مطبوعان على اللوحة</text><text x="1460" y="320" font-size="16" fill="#222" text-anchor="end"></text><text x="1460" y="352" font-size="16" fill="#222" text-anchor="start" font-weight="bold" direction="rtl" unicode-bidi="embed">للمشروع نحتاج 4 أطراف فقط:</text><text x="1460" y="384" font-size="16" fill="#1f6fd1" text-anchor="end" font-weight="bold">VCC · GND · SCL · SDA</text><text x="1460" y="416" font-size="16" fill="#222" text-anchor="start" direction="rtl" unicode-bidi="embed">وAD0 إلى GND (العنوان 0x68)</text><text x="1460" y="448" font-size="16" fill="#222" text-anchor="end"></text><text x="1460" y="480" font-size="16" fill="#8a8a8a" text-anchor="start" direction="rtl" unicode-bidi="embed">XDA وXCL وINT: تبقى فارغة</text><text x="750" y="690" font-size="16" fill="#222" text-anchor="middle" direction="rtl" unicode-bidi="embed">ثبّتها على القاعدة الثابتة للرأسين، وسهماها X وY موازيان لمحوري الحامل، بعيداً 10–15 سم عن السيرفوهات.</text></svg>