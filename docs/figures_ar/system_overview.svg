<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1130" viewBox="0 0 1700 1130" font-family="DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fff"/><text x="850" y="48" font-size="30" fill="#222" text-anchor="middle" font-weight="bold" direction="rtl" unicode-bidi="embed">النظام الكامل: كيف يتصل كل بيكو بالـ Raspberry Pi</text><text x="850" y="82" font-size="17" fill="#8a8a8a" text-anchor="middle">System overview – two Picos, each on its own USB cable; no other wires to the Raspberry Pi</text><rect x="575" y="150" width="550" height="250" rx="16" fill="#2e7d32" stroke="#222" stroke-width="2"/><text x="850.0" y="200" font-size="26" fill="#fff" text-anchor="middle" font-weight="bold" direction="rtl" unicode-bidi="embed">Raspberry Pi (الحاسوب)</text><text x="850.0" y="250" font-size="17" fill="#fff" text-anchor="middle" direction="rtl" unicode-bidi="embed">يستقبل الصوت ويحسب الاتجاه (droneloc live)</text><text x="850.0" y="284" font-size="17" fill="#fff" text-anchor="middle" direction="rtl" unicode-bidi="embed">يستقبل صور الكاميرا ويعرضها ويسجّلها</text><text x="850.0" y="318" font-size="17" fill="#fff" text-anchor="middle" direction="rtl" unicode-bidi="embed">يرسل للبيكو 2 أمر: «وجّه الحامل إلى السمت والارتفاع»</text><rect x="640" y="390" width="70" height="46" rx="4" fill="#cfd8dc" stroke="#455a64" stroke-width="1.6"/><text x="675" y="420" font-size="13" fill="#222" text-anchor="middle" font-weight="bold">USB 1</text><rect x="725" y="390" width="70" height="46" rx="4" fill="#eceff1" stroke="#455a64" stroke-width="1.6"/><text x="760" y="420" font-size="13" fill="#8a8a8a" text-anchor="middle">USB 2</text><rect x="910" y="390" width="70" height="46" rx="4" fill="#cfd8dc" stroke="#455a64" stroke-width="1.6"/><text x="945" y="420" font-size="13" fill="#222" text-anchor="middle" font-weight="bold">USB 3</text><rect x="995" y="390" width="70" height="46" rx="4" fill="#eceff1" stroke="#455a64" stroke-width="1.6"/><text x="1030" y="420" font-size="13" fill="#8a8a8a" text-anchor="middle">USB 4</text><rect x="1240" y="175" width="300" height="80" rx="10" fill="#fff3e0" stroke="#b23c00" stroke-width="1.6"/><text x="1390" y="208" font-size="17" fill="#b23c00" text-anchor="middle" font-weight="bold" direction="rtl" unicode-bidi="embed">مزوّد الباي الرسمي</text><text x="1390" y="235" font-size="15" fill="#b23c00" text-anchor="middle">USB-C · 5V · 3A</text><polyline points="1240,215 1125,215" fill="none" stroke="#b23c00" stroke-width="4" stroke-linejoin="round"/><polygon points="1127,215 1139.6062594329376,208.91048252244278 1139.6062594329376,221.08951747755722" fill="#b23c00"/><rect x="110" y="610" width="380" height="130" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/><text x="300.0" y="652" font-size="22" fill="#1b5e20" text-anchor="middle" font-weight="bold" direction="rtl" unicode-bidi="embed">بيكو 1 — الصوت</text><text x="300.0" y="684" font-size="15" fill="#222" text-anchor="middle" direction="rtl" unicode-bidi="embed">البرنامج: pico_mic_array.uf2</text><text x="300.0" y="712" font-size="14" fill="#8a8a8a" text-anchor="middle" direction="rtl" unicode-bidi="embed">يظهر في الباي باسم «DroneLoc Mic Array»</text><rect x="140" y="850" width="320" height="90" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/><text x="300" y="890" font-size="19" fill="#0d47a1" text-anchor="middle" font-weight="bold" direction="rtl" unicode-bidi="embed">12 × ميكروفون INMP441</text><text x="300" y="918" font-size="14" fill="#8a8a8a" text-anchor="middle" direction="rtl" unicode-bidi="embed">6 على الكرة + 5 مرجعية + 1 احتياط</text><polyline points="220,850 220,740" fill="none" stroke="#1a9a3a" stroke-width="3" stroke-linejoin="round"/><polyline points="260,850 260,740" fill="none" stroke="#ff8c00" stroke-width="3" stroke-linejoin="round"/><polyline points="300,850 300,740" fill="none" stroke="#1f6fd1" stroke-width="3" stroke-linejoin="round"/><polyline points="340,850 340,740" fill="none" stroke="#d62728" stroke-width="3" stroke-linejoin="round"/><polyline points="380,850 380,740" fill="none" stroke="#222" stroke-width="3" stroke-linejoin="round"/><text x="495" y="800" font-size="14" fill="#222" text-anchor="end" direction="rtl" unicode-bidi="embed">أسلاك: SD×6 · SCK · WS · 3V3 · GND</text><polyline points="300,610 300,545 675,545 675,436" fill="none" stroke="#555" stroke-width="6" stroke-linejoin="round"/><polygon points="675,438 681.9594485457797,452.4071536376428 668.0405514542203,452.4071536376428" fill="#555"/><rect x="318" y="492" width="286" height="44" rx="6" fill="#fff" stroke="#bbb" stroke-width="1"/><text x="461" y="512" font-size="14" fill="#222" text-anchor="middle" direction="rtl" unicode-bidi="embed">كابل micro-USB ← USB-A (بيانات)</text><text x="461" y="530" font-size="13" fill="#1a9a3a" text-anchor="middle" font-weight="bold" direction="rtl" unicode-bidi="embed">صوت 12 قناة ← 375 كيلوبايت/ثانية ↑</text><rect x="1210" y="610" width="380" height="130" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/><text x="1400.0" y="652" font-size="22" fill="#1b5e20" text-anchor="middle" font-weight="bold" direction="rtl" unicode-bidi="embed">بيكو 2 — المشاهدة</text><text x="1400.0" y="684" font-size="15" fill="#222" text-anchor="middle" direction="rtl" unicode-bidi="embed">البرنامج: pico_pointer.uf2 (سيُكتب)</text><text x="1400.0" y="712" font-size="14" fill="#8a8a8a" text-anchor="middle" direction="rtl" unicode-bidi="embed">يظهر في الباي باسم «DroneLoc Pointer»</text><polyline points="1400,610 1400,545 945,545 945,436" fill="none" stroke="#555" stroke-width="6" stroke-linejoin="round"/><polygon points="945,438 951.9594485457797,452.4071536376428 938.0405514542203,452.4071536376428" fill="#555"/><rect x="1012" y="492" width="330" height="44" rx="6" fill="#fff" stroke="#bbb" stroke-width="1"/><text x="1177" y="512" font-size="14" fill="#222" text-anchor="middle" direction="rtl" unicode-bidi="embed">↑ صور 160×120 · ↓ أوامر السيرفو والليزر</text><text x="1177" y="530" font-size="13" fill="#8a8a8a" text-anchor="middle" direction="rtl" unicode-bidi="embed">كابل micro-USB ← USB-A (بيانات)</text><rect x="1070" y="850" width="200" height="90" rx="10" fill="#e3f2fd" stroke="#1f6fd1" stroke-width="2"/><text x="1170.0" y="890" font-size="17" fill="#1f6fd1" text-anchor="middle" font-weight="bold" direction="rtl" unicode-bidi="embed">كاميرا OV7670</text><text x="1170.0" y="918" font-size="14" fill="#8a8a8a" text-anchor="middle" direction="rtl" unicode-bidi="embed">18 طرفاً · 3.3V</text><polyline points="1170.0,850 1170.0,795 1400,795 1400,740" fill="none" stroke="#1f6fd1" stroke-width="3" stroke-linejoin="round"/><rect x="1300" y="850" width="200" height="90" rx="10" fill="#fce4ec" stroke="#c2185b" stroke-width="2"/><text x="1400.0" y="890" font-size="17" fill="#c2185b" text-anchor="middle" font-weight="bold" direction="rtl" unicode-bidi="embed">2 × سيرفو MG995</text><text x="1400.0" y="918" font-size="14" fill="#8a8a8a" text-anchor="middle">Pan + Tilt</text><polyline points="1400.0,850 1400.0,795 1400,795 1400,740" fill="none" stroke="#c2185b" stroke-width="3" stroke-linejoin="round"/><rect x="1520" y="850" width="160" height="90" rx="10" fill="#ffebee" stroke="#d62728" stroke-width="2"/><text x="1600.0" y="890" font-size="17" fill="#d62728" text-anchor="middle" font-weight="bold" direction="rtl" unicode-bidi="embed">ليزر</text><text x="1600.0" y="918" font-size="14" fill="#8a8a8a" text-anchor="middle" direction="rtl" unicode-bidi="embed">أقل من 1mW</text><polyline points="1600.0,850 1600.0,795 1400,795 1400,740" fill="none" stroke="#d62728" stroke-width="3" stroke-linejoin="round"/><text x="1180" y="788" font-size="13" fill="#1f6fd1" text-anchor="start" direction="rtl" unicode-bidi="embed">16 سلكاً</text><rect x="1300" y="990" width="380" height="70" rx="10" fill="#fff3e0" stroke="#b23c00" stroke-width="2"/><text x="1490" y="1020" font-size="16" fill="#b23c00" text-anchor="middle" font-weight="bold" direction="rtl" unicode-bidi="embed">مزوّد منفصل 5V / 5A للسيرفو والليزر</text><text x="1490" y="1045" font-size="14" fill="#b23c00" text-anchor="middle" direction="rtl" unicode-bidi="embed">+ مكثف 1000µF</text><polyline points="1400,990 1400,940" fill="none" stroke="#b23c00" stroke-width="4" stroke-linejoin="round"/><polyline points="1600,990 1600,940" fill="none" stroke="#b23c00" stroke-width="4" stroke-linejoin="round"/><polyline points="1300,1035 1286,1035 1286,740" fill="none" stroke="#222" stroke-width="3" stroke-linejoin="round" stroke-dasharray="8,5"/><text x="1258" y="1090" font-size="14" fill="#222" text-anchor="end" font-weight="bold" direction="rtl" unicode-bidi="embed">أرضي مشترك مع البيكو 2 (الخط المتقطع)</text><text x="1180" y="990" font-size="15" fill="#222" text-anchor="start" direction="rtl" unicode-bidi="embed">• كل بيكو يأخذ الكهرباء من كابل الـ USB نفسه، فلا يحتاج مصدراً آخر.</text><text x="1180" y="1020" font-size="15" fill="#222" text-anchor="start" direction="rtl" unicode-bidi="embed">• لا توجد أسلاك أخرى بين البيكو والباي، ولا بين البيكوين.</text><text x="1180" y="1050" font-size="15" fill="#222" text-anchor="start" direction="rtl" unicode-bidi="embed">• البرنامج يميّز البيكوين بالاسم، فلا يهم أي منفذ USB تستخدم.</text><text x="1180" y="1080" font-size="15" fill="#d62728" text-anchor="start" font-weight="bold" direction="rtl" unicode-bidi="embed">• لا تغذِّ السيرفو من البيكو أو من الباي.</text></svg>