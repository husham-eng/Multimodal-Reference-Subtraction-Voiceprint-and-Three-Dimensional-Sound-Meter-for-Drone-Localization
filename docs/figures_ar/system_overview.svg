<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180" font-family="DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fff"/><text x="900" y="48" font-size="30" fill="#222" text-anchor="middle" font-weight="bold" direction="rtl" unicode-bidi="embed">النظام الكامل: كيف تتصل القطع بالـ Raspberry Pi</text><text x="900" y="82" font-size="17" fill="#8a8a8a" text-anchor="middle">System overview – audio Pico, servo Pico with two pan/tilt heads, two USB cameras (Raspberry Pi 4 assumed)</text><rect x="560" y="130" width="680" height="225" rx="16" fill="#2e7d32" stroke="#222" stroke-width="2"/><text x="900.0" y="176" font-size="26" fill="#fff" text-anchor="middle" font-weight="bold" direction="rtl" unicode-bidi="embed">Raspberry Pi (الحاسوب)</text><text x="900.0" y="222" font-size="17" fill="#fff" text-anchor="middle" direction="rtl" unicode-bidi="embed">يستقبل الصوت ويحسب الاتجاه (droneloc live)</text><text x="900.0" y="254" font-size="17" fill="#fff" text-anchor="middle" direction="rtl" unicode-bidi="embed">يقرأ الكاميرتين مباشرة ويقيس الخطأ بالدرجات</text><text x="900.0" y="286" font-size="17" fill="#fff" text-anchor="middle" direction="rtl" unicode-bidi="embed">يرسل للبيكو 2 زوايا الرأسين (Pan / Tilt)</text><rect x="640" y="341" width="76" height="52" rx="4" fill="#37474f" stroke="#263238" stroke-width="1.6"/><text x="678" y="361" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">USB ①</text><text x="678" y="381" font-size="12" fill="#fff" text-anchor="middle">2.0</text><rect x="740" y="341" width="76" height="52" rx="4" fill="#37474f" stroke="#263238" stroke-width="1.6"/><text x="778" y="361" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">USB ②</text><text x="778" y="381" font-size="12" fill="#fff" text-anchor="middle">2.0</text><rect x="980" y="341" width="76" height="52" rx="4" fill="#1565c0" stroke="#263238" stroke-width="1.6"/><text x="1018" y="361" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">USB ③</text><text x="1018" y="381" font-size="12" fill="#fff" text-anchor="middle">3.0</text><rect x="1080" y="341" width="76" height="52" rx="4" fill="#1565c0" stroke="#263238" stroke-width="1.6"/><text x="1118" y="361" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">USB ④</text><text x="1118" y="381" font-size="12" fill="#fff" text-anchor="middle">3.0</text><rect x="1340" y="160" width="300" height="76" rx="10" fill="#fff3e0" stroke="#b23c00" stroke-width="1.6"/><text x="1490" y="192" font-size="17" fill="#b23c00" text-anchor="middle" font-weight="bold" direction="rtl" unicode-bidi="embed">مزوّد الباي الرسمي</text><text x="1490" y="218" font-size="15" fill="#b23c00" text-anchor="middle">USB-C · 5V · 3A</text><polyline points="1340,198 1240,198" fill="none" stroke="#b23c00" stroke-width="4" stroke-linejoin="round"/><polygon points="1242,198 1254.6062594329376,191.91048252244278 1254.6062594329376,204.08951747755722" fill="#b23c00"/><rect x="60" y="600" width="360" height="125" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/><text x="240.0" y="640" font-size="22" fill="#1b5e20" text-anchor="middle" font-weight="bold" direction="rtl" unicode-bidi="embed">بيكو 1 — الصوت</text><text x="240.0" y="672" font-size="15" fill="#222" text-anchor="middle" direction="rtl" unicode-bidi="embed">البرنامج: pico_mic_array.uf2</text><text x="240.0" y="700" font-size="14" fill="#8a8a8a" text-anchor="middle" direction="rtl" unicode-bidi="embed">الاسم في الباي: «DroneLoc Mic Array»</text><polyline points="240,600 240,520 678,520 678,395" fill="none" stroke="#555" stroke-width="6" stroke-linejoin="round"/><polygon points="678,397 684.9594485457797,411.4071536376428 671.0405514542203,411.4071536376428" fill="#555"/><text x="440" y="510" font-size="13" fill="#555" text-anchor="middle" font-weight="bold" direction="rtl" unicode-bidi="embed">micro-USB · صوت 12 قناة ↑</text><rect x="80" y="840" width="320" height="90" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/><text x="240" y="880" font-size="19" fill="#0d47a1" text-anchor="middle" font-weight="bold" direction="rtl" unicode-bidi="embed">12 × ميكروفون INMP441</text><text x="240" y="908" font-size="14" fill="#8a8a8a" text-anchor="middle" direction="rtl" unicode-bidi="embed">6 على الكرة + 5 مرجعية + 1 احتياط</text><polyline points="160,840 160,725" fill="none" stroke="#1a9a3a" stroke-width="3" stroke-linejoin="round"/><polyline points="200,840 200,725" fill="none" stroke="#ff8c00" stroke-width="3" stroke-linejoin="round"/><polyline points="240,840 240,725" fill="none" stroke="#1f6fd1" stroke-width="3" stroke-linejoin="round"/><polyline points="280,840 280,725" fill="none" stroke="#d62728" stroke-width="3" stroke-linejoin="round"/><polyline points="320,840 320,725" fill="none" stroke="#222" stroke-width="3" stroke-linejoin="round"/><text x="80" y="975" font-size="14" fill="#222" text-anchor="end" direction="rtl" unicode-bidi="embed">أسلاك: SD×6 · SCK · WS · 3V3 · GND</text><rect x="500" y="600" width="360" height="125" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/><text x="680.0" y="640" font-size="22" fill="#1b5e20" text-anchor="middle" font-weight="bold" direction="rtl" unicode-bidi="embed">بيكو 2 — السيرفوهات</text><text x="680.0" y="672" font-size="15" fill="#222" text-anchor="middle" direction="rtl" unicode-bidi="embed">البرنامج: pico_pointer.uf2 (سيُكتب)</text><text x="680.0" y="700" font-size="14" fill="#8a8a8a" text-anchor="middle" direction="rtl" unicode-bidi="embed">الاسم في الباي: «DroneLoc Pointer»</text><polyline points="778,600 778,395" fill="none" stroke="#555" stroke-width="6" stroke-linejoin="round"/><polygon points="778,397 784.9594485457797,411.4071536376428 771.0405514542203,411.4071536376428" fill="#555"/><text x="858" y="560" font-size="13" fill="#555" text-anchor="middle" font-weight="bold" direction="rtl" unicode-bidi="embed">↓ زوايا الرأسين</text><rect x="980" y="560" width="400" height="150" rx="12" fill="#fce4ec" stroke="#c2185b" stroke-width="2.5"/><text x="1180" y="598" font-size="18" fill="#c2185b" text-anchor="middle" font-weight="bold" direction="rtl" unicode-bidi="embed">الرأس العلوي: نصف الكرة العلوي</text><text x="1180" y="632" font-size="15" fill="#222" text-anchor="middle" direction="rtl" unicode-bidi="embed">سيرفو أفقي + سيرفو رأسي (MG995)</text><rect x="1050" y="652" width="260" height="40" rx="8" fill="#e3f2fd" stroke="#1f6fd1" stroke-width="1.8"/><text x="1180" y="678" font-size="15" fill="#1f6fd1" text-anchor="middle" font-weight="bold" direction="rtl" unicode-bidi="embed">كاميرا Brio 100 رقم 1</text><polyline points="860,650 980,650" fill="none" stroke="#c2185b" stroke-width="3" stroke-linejoin="round"/><text x="915" y="640" font-size="13" fill="#c2185b" text-anchor="middle" font-weight="bold">GP16 · GP17</text><rect x="980" y="820" width="400" height="150" rx="12" fill="#fce4ec" stroke="#c2185b" stroke-width="2.5"/><text x="1180" y="858" font-size="18" fill="#c2185b" text-anchor="middle" font-weight="bold" direction="rtl" unicode-bidi="embed">الرأس السفلي (مقلوب): النصف السفلي</text><text x="1180" y="892" font-size="15" fill="#222" text-anchor="middle" direction="rtl" unicode-bidi="embed">سيرفو أفقي + سيرفو رأسي (MG995)</text><rect x="1050" y="912" width="260" height="40" rx="8" fill="#e3f2fd" stroke="#1f6fd1" stroke-width="1.8"/><text x="1180" y="938" font-size="15" fill="#1f6fd1" text-anchor="middle" font-weight="bold" direction="rtl" unicode-bidi="embed">كاميرا Brio 100 رقم 2</text><polyline points="860,700 955,700 955,880 980,880" fill="none" stroke="#c2185b" stroke-width="3" stroke-linejoin="round"/><text x="900" y="884" font-size="13" fill="#c2185b" text-anchor="middle" font-weight="bold">GP18 · GP19</text><polyline points="1180,560 1180,470 1018,470 1018,395" fill="none" stroke="#1f6fd1" stroke-width="6" stroke-linejoin="round"/><polygon points="1018,397 1024.9594485457797,411.4071536376428 1011.0405514542203,411.4071536376428" fill="#1f6fd1"/><polyline points="1380,895 1440,895 1440,450 1118,450 1118,395" fill="none" stroke="#1f6fd1" stroke-width="6" stroke-linejoin="round"/><polygon points="1118,397 1124.9594485457797,411.4071536376428 1111.0405514542203,411.4071536376428" fill="#1f6fd1"/><text x="1450" y="520" font-size="14" fill="#1f6fd1" text-anchor="end" font-weight="bold" direction="rtl" unicode-bidi="embed">كابلا الكاميرتين</text><text x="1450" y="542" font-size="13" fill="#1f6fd1" text-anchor="end" direction="rtl" unicode-bidi="embed">إلى الباي مباشرة (USB 3)</text><rect x="980" y="1015" width="190" height="80" rx="10" fill="#fff3e0" stroke="#b23c00" stroke-width="2"/><text x="1075" y="1045" font-size="14" fill="#b23c00" text-anchor="middle" font-weight="bold" direction="rtl" unicode-bidi="embed">مزوّد الرأس السفلي</text><text x="1075" y="1071" font-size="13" fill="#b23c00" text-anchor="middle">5V / 5A · 1000µF</text><rect x="1190" y="1015" width="190" height="80" rx="10" fill="#fff3e0" stroke="#b23c00" stroke-width="2"/><text x="1285" y="1045" font-size="14" fill="#b23c00" text-anchor="middle" font-weight="bold" direction="rtl" unicode-bidi="embed">مزوّد الرأس العلوي</text><text x="1285" y="1071" font-size="13" fill="#b23c00" text-anchor="middle">5V / 5A · 1000µF</text><polyline points="1285,1015 1285,995 1500,995 1500,690 1380,690" fill="none" stroke="#b23c00" stroke-width="3.4" stroke-linejoin="round"/><polyline points="1075,1015 1075,970" fill="none" stroke="#b23c00" stroke-width="3.4" stroke-linejoin="round"/><text x="1510" y="840" font-size="13" fill="#b23c00" text-anchor="end" font-weight="bold" direction="rtl" unicode-bidi="embed">تغذية الرأس العلوي</text><polyline points="980,1055 820,1055 820,725" fill="none" stroke="#222" stroke-width="3" stroke-linejoin="round" stroke-dasharray="8,5"/><text x="830" y="1085" font-size="13" fill="#222" text-anchor="middle" font-weight="bold" direction="rtl" unicode-bidi="embed">أرضي مشترك مع البيكو 2</text><text x="1780" y="1025" font-size="15" fill="#222" text-anchor="start" direction="rtl" unicode-bidi="embed">• كل بيكو يأخذ الكهرباء من كابل الـ USB نفسه.</text><text x="1780" y="1055" font-size="15" fill="#222" text-anchor="start" direction="rtl" unicode-bidi="embed">• الكاميرتان توصلان بالباي مباشرة، وليس بالبيكو.</text><text x="1780" y="1085" font-size="15" fill="#222" text-anchor="start" direction="rtl" unicode-bidi="embed">• البرنامج يميّز البيكوين بالاسم والكاميرتين بالرقم التسلسلي.</text><text x="1780" y="1115" font-size="15" fill="#222" text-anchor="start" direction="rtl" unicode-bidi="embed">• الخطوط المتقاطعة دون نقطة غير موصولة ببعضها.</text><text x="1780" y="1145" font-size="15" fill="#d62728" text-anchor="start" font-weight="bold" direction="rtl" unicode-bidi="embed">• لا تغذِّ السيرفو من البيكو أو من الباي.</text></svg>