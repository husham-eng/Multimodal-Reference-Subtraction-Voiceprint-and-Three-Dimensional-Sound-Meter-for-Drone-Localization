<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" font-family="DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fff"/><text x="900" y="48" font-size="30" fill="#222" text-anchor="middle" font-weight="bold" direction="rtl" unicode-bidi="embed">توصيل البوصلتين بالـ Raspberry Pi</text><text x="900" y="82" font-size="17" fill="#8a8a8a" text-anchor="middle">BNO085 on the sphere (UART-RVC → RXD) · MPU-6050 GY-521 on the heads base (I2C)</text><rect x="610" y="120" width="300" height="530" rx="14" fill="#2e7d32" stroke="#222" stroke-width="2"/><text x="760" y="148" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold" direction="rtl" unicode-bidi="embed">Raspberry Pi — الأطراف 1 إلى 20</text><circle cx="738" cy="185" r="9" fill="#d62728" stroke="#333" stroke-width="1.5"/><text x="738" y="190" font-size="10" fill="#fff" text-anchor="middle" font-weight="bold">1</text><text x="704" y="190" font-size="13" fill="#d62728" text-anchor="end" font-weight="bold">3V3</text><circle cx="782" cy="185" r="9" fill="#e0e0e0" stroke="#333" stroke-width="1.5"/><text x="782" y="190" font-size="10" fill="#333" text-anchor="middle" font-weight="bold">2</text><text x="816" y="190" font-size="13" fill="#c8e6c9" text-anchor="start">5V</text><circle cx="738" cy="231" r="9" fill="#1f6fd1" stroke="#333" stroke-width="1.5"/><text x="738" y="236" font-size="10" fill="#fff" text-anchor="middle" font-weight="bold">3</text><text x="704" y="236" font-size="13" fill="#1f6fd1" text-anchor="end" font-weight="bold">GPIO2 SDA</text><circle cx="782" cy="231" r="9" fill="#e0e0e0" stroke="#333" stroke-width="1.5"/><text x="782" y="236" font-size="10" fill="#333" text-anchor="middle" font-weight="bold">4</text><text x="816" y="236" font-size="13" fill="#c8e6c9" text-anchor="start">5V</text><circle cx="738" cy="277" r="9" fill="#7b1fa2" stroke="#333" stroke-width="1.5"/><text x="738" y="282" font-size="10" fill="#fff" text-anchor="middle" font-weight="bold">5</text><text x="704" y="282" font-size="13" fill="#7b1fa2" text-anchor="end" font-weight="bold">GPIO3 SCL</text><circle cx="782" cy="277" r="9" fill="#222" stroke="#333" stroke-width="1.5"/><text x="782" y="282" font-size="10" fill="#fff" text-anchor="middle" font-weight="bold">6</text><text x="816" y="282" font-size="13" fill="#222" text-anchor="start" font-weight="bold">GND</text><circle cx="738" cy="323" r="9" fill="#e0e0e0" stroke="#333" stroke-width="1.5"/><text x="738" y="328" font-size="10" fill="#333" text-anchor="middle" font-weight="bold">7</text><text x="704" y="328" font-size="13" fill="#c8e6c9" text-anchor="end">GPIO4</text><circle cx="782" cy="323" r="9" fill="#e0e0e0" stroke="#333" stroke-width="1.5"/><text x="782" y="328" font-size="10" fill="#333" text-anchor="middle" font-weight="bold">8</text><text x="816" y="328" font-size="13" fill="#c8e6c9" text-anchor="start">GPIO14 TXD</text><circle cx="738" cy="369" r="9" fill="#222" stroke="#333" stroke-width="1.5"/><text x="738" y="374" font-size="10" fill="#fff" text-anchor="middle" font-weight="bold">9</text><text x="704" y="374" font-size="13" fill="#222" text-anchor="end" font-weight="bold">GND</text><circle cx="782" cy="369" r="9" fill="#ff8c00" stroke="#333" stroke-width="1.5"/><text x="782" y="374" font-size="10" fill="#fff" text-anchor="middle" font-weight="bold">10</text><text x="816" y="374" font-size="13" fill="#ff8c00" text-anchor="start" font-weight="bold">GPIO15 RXD</text><circle cx="738" cy="415" r="9" fill="#e0e0e0" stroke="#333" stroke-width="1.5"/><text x="738" y="420" font-size="10" fill="#333" text-anchor="middle" font-weight="bold">11</text><text x="704" y="420" font-size="13" fill="#c8e6c9" text-anchor="end">GPIO17</text><circle cx="782" cy="415" r="9" fill="#e0e0e0" stroke="#333" stroke-width="1.5"/><text x="782" y="420" font-size="10" fill="#333" text-anchor="middle" font-weight="bold">12</text><text x="816" y="420" font-size="13" fill="#c8e6c9" text-anchor="start">GPIO18</text><circle cx="738" cy="461" r="9" fill="#e0e0e0" stroke="#333" stroke-width="1.5"/><text x="738" y="466" font-size="10" fill="#333" text-anchor="middle" font-weight="bold">13</text><text x="704" y="466" font-size="13" fill="#c8e6c9" text-anchor="end">GPIO27</text><circle cx="782" cy="461" r="9" fill="#e0e0e0" stroke="#333" stroke-width="1.5"/><text x="782" y="466" font-size="10" fill="#333" text-anchor="middle" font-weight="bold">14</text><text x="816" y="466" font-size="13" fill="#c8e6c9" text-anchor="start">GND</text><circle cx="738" cy="507" r="9" fill="#e0e0e0" stroke="#333" stroke-width="1.5"/><text x="738" y="512" font-size="10" fill="#333" text-anchor="middle" font-weight="bold">15</text><text x="704" y="512" font-size="13" fill="#c8e6c9" text-anchor="end">GPIO22</text><circle cx="782" cy="507" r="9" fill="#e0e0e0" stroke="#333" stroke-width="1.5"/><text x="782" y="512" font-size="10" fill="#333" text-anchor="middle" font-weight="bold">16</text><text x="816" y="512" font-size="13" fill="#c8e6c9" text-anchor="start">GPIO23</text><circle cx="738" cy="553" r="9" fill="#d62728" stroke="#333" stroke-width="1.5"/><text x="738" y="558" font-size="10" fill="#fff" text-anchor="middle" font-weight="bold">17</text><text x="704" y="558" font-size="13" fill="#d62728" text-anchor="end" font-weight="bold">3V3</text><circle cx="782" cy="553" r="9" fill="#e0e0e0" stroke="#333" stroke-width="1.5"/><text x="782" y="558" font-size="10" fill="#333" text-anchor="middle" font-weight="bold">18</text><text x="816" y="558" font-size="13" fill="#c8e6c9" text-anchor="start">GPIO24</text><circle cx="738" cy="599" r="9" fill="#e0e0e0" stroke="#333" stroke-width="1.5"/><text x="738" y="604" font-size="10" fill="#333" text-anchor="middle" font-weight="bold">19</text><text x="704" y="604" font-size="13" fill="#c8e6c9" text-anchor="end">GPIO10</text><circle cx="782" cy="599" r="9" fill="#e0e0e0" stroke="#333" stroke-width="1.5"/><text x="782" y="604" font-size="10" fill="#333" text-anchor="middle" font-weight="bold">20</text><text x="816" y="604" font-size="13" fill="#c8e6c9" text-anchor="start">GND</text><text x="760" y="670" font-size="13" fill="#8a8a8a" text-anchor="middle" direction="rtl" unicode-bidi="embed">الطرف 1 بجانب فتحة بطاقة الذاكرة (المربع)</text><rect x="70" y="160" width="470" height="330" rx="12" fill="#ede7f6" stroke="#4527a0" stroke-width="2.5"/><text x="305" y="192" font-size="18" fill="#4527a0" text-anchor="middle" font-weight="bold">BNO085 (Adafruit 4754)</text><text x="305" y="218" font-size="15" fill="#222" text-anchor="middle" font-weight="bold" direction="rtl" unicode-bidi="embed">على كرة الميكروفونات</text><rect x="100" y="262" width="16" height="16" rx="3" fill="#d62728" stroke="#d62728" stroke-width="1.6"/><text x="128" y="276" font-size="15" fill="#d62728" text-anchor="start" font-weight="bold">VIN</text><polyline points="300,270 370,270" fill="none" stroke="#d62728" stroke-width="3" stroke-linejoin="round"/><polygon points="376,270 365.1946347717679,275.21958640933474 365.1946347717679,264.78041359066526" fill="#d62728"/><text x="525" y="276" font-size="15" fill="#d62728" text-anchor="start" font-weight="bold" direction="rtl" unicode-bidi="embed">طرف 1 (3V3)</text><rect x="100" y="312" width="16" height="16" rx="3" fill="#222" stroke="#222" stroke-width="1.6"/><text x="128" y="326" font-size="15" fill="#222" text-anchor="start" font-weight="bold">GND</text><polyline points="300,320 370,320" fill="none" stroke="#222" stroke-width="3" stroke-linejoin="round"/><polygon points="376,320 365.1946347717679,325.21958640933474 365.1946347717679,314.78041359066526" fill="#222"/><text x="525" y="326" font-size="15" fill="#222" text-anchor="start" font-weight="bold" direction="rtl" unicode-bidi="embed">طرف 6 (GND)</text><rect x="100" y="362" width="16" height="16" rx="3" fill="#ff8c00" stroke="#ff8c00" stroke-width="1.6"/><text x="128" y="376" font-size="15" fill="#ff8c00" text-anchor="end" font-weight="bold" direction="rtl" unicode-bidi="embed">SDA (خرج RVC)</text><polyline points="300,370 370,370" fill="none" stroke="#ff8c00" stroke-width="3" stroke-linejoin="round"/><polygon points="376,370 365.1946347717679,375.21958640933474 365.1946347717679,364.78041359066526" fill="#ff8c00"/><text x="525" y="376" font-size="15" fill="#ff8c00" text-anchor="start" font-weight="bold" direction="rtl" unicode-bidi="embed">طرف 10 (RXD)</text><rect x="100" y="412" width="16" height="16" rx="3" fill="#d62728" stroke="#d62728" stroke-width="1.6"/><text x="128" y="426" font-size="15" fill="#d62728" text-anchor="start" font-weight="bold">P0</text><polyline points="300,420 370,420" fill="none" stroke="#d62728" stroke-width="3" stroke-linejoin="round"/><polygon points="376,420 365.1946347717679,425.21958640933474 365.1946347717679,414.78041359066526" fill="#d62728"/><text x="525" y="426" font-size="15" fill="#d62728" text-anchor="start" font-weight="bold" direction="rtl" unicode-bidi="embed">إلى 3V3 (مع VIN)</text><text x="305" y="465" font-size="13" fill="#8a8a8a" text-anchor="middle" direction="rtl" unicode-bidi="embed">P0 إلى 3V3 يختار نمط UART-RVC</text><rect x="1260" y="160" width="470" height="330" rx="12" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5"/><text x="1495" y="192" font-size="18" fill="#1565c0" text-anchor="middle" font-weight="bold">MPU-6050 (GY-521)</text><text x="1495" y="218" font-size="15" fill="#222" text-anchor="middle" font-weight="bold" direction="rtl" unicode-bidi="embed">على القاعدة الثابتة للرأسين</text><rect x="1290" y="252" width="16" height="16" rx="3" fill="#d62728" stroke="#d62728" stroke-width="1.6"/><text x="1318" y="266" font-size="15" fill="#d62728" text-anchor="start" font-weight="bold">VCC</text><polyline points="1410,260 1480,260" fill="none" stroke="#d62728" stroke-width="3" stroke-linejoin="round"/><polygon points="1486,260 1475.1946347717678,265.21958640933474 1475.1946347717678,254.78041359066523" fill="#d62728"/><text x="1715" y="266" font-size="15" fill="#d62728" text-anchor="start" font-weight="bold" direction="rtl" unicode-bidi="embed">طرف 17 (3V3)</text><rect x="1290" y="296" width="16" height="16" rx="3" fill="#222" stroke="#222" stroke-width="1.6"/><text x="1318" y="310" font-size="15" fill="#222" text-anchor="start" font-weight="bold">GND</text><polyline points="1410,304 1480,304" fill="none" stroke="#222" stroke-width="3" stroke-linejoin="round"/><polygon points="1486,304 1475.1946347717678,309.21958640933474 1475.1946347717678,298.78041359066526" fill="#222"/><text x="1715" y="310" font-size="15" fill="#222" text-anchor="start" font-weight="bold" direction="rtl" unicode-bidi="embed">طرف 9 (GND)</text><rect x="1290" y="340" width="16" height="16" rx="3" fill="#1f6fd1" stroke="#1f6fd1" stroke-width="1.6"/><text x="1318" y="354" font-size="15" fill="#1f6fd1" text-anchor="start" font-weight="bold">SDA</text><polyline points="1410,348 1480,348" fill="none" stroke="#1f6fd1" stroke-width="3" stroke-linejoin="round"/><polygon points="1486,348 1475.1946347717678,353.21958640933474 1475.1946347717678,342.78041359066526" fill="#1f6fd1"/><text x="1715" y="354" font-size="15" fill="#1f6fd1" text-anchor="start" font-weight="bold" direction="rtl" unicode-bidi="embed">طرف 3 (SDA)</text><rect x="1290" y="384" width="16" height="16" rx="3" fill="#7b1fa2" stroke="#7b1fa2" stroke-width="1.6"/><text x="1318" y="398" font-size="15" fill="#7b1fa2" text-anchor="start" font-weight="bold">SCL</text><polyline points="1410,392 1480,392" fill="none" stroke="#7b1fa2" stroke-width="3" stroke-linejoin="round"/><polygon points="1486,392 1475.1946347717678,397.21958640933474 1475.1946347717678,386.78041359066526" fill="#7b1fa2"/><text x="1715" y="398" font-size="15" fill="#7b1fa2" text-anchor="start" font-weight="bold" direction="rtl" unicode-bidi="embed">طرف 5 (SCL)</text><rect x="1290" y="428" width="16" height="16" rx="3" fill="#222" stroke="#222" stroke-width="1.6"/><text x="1318" y="442" font-size="15" fill="#222" text-anchor="start" font-weight="bold">AD0</text><polyline points="1410,436 1480,436" fill="none" stroke="#222" stroke-width="3" stroke-linejoin="round"/><polygon points="1486,436 1475.1946347717678,441.21958640933474 1475.1946347717678,430.78041359066526" fill="#222"/><text x="1715" y="442" font-size="15" fill="#222" text-anchor="start" font-weight="bold" direction="rtl" unicode-bidi="embed">GND (العنوان 0x68)</text><polyline points="40,670 1760,670" fill="none" stroke="#ddd" stroke-width="2" stroke-linejoin="round"/><text x="1760" y="700" font-size="15" fill="#222" text-anchor="start" font-weight="bold" direction="rtl" unicode-bidi="embed">قبل التوصيل: فعّل I2C والمنفذ التسلسلي في الباي (sudo raspi-config ← Interface Options)، ثم أعد التشغيل.</text><text x="1760" y="740" font-size="15" fill="#222" text-anchor="start" direction="rtl" unicode-bidi="embed">• BNO085: نمط UART-RVC يرسل الاتجاه الجاهز (yaw/pitch/roll) 100 مرة/ثانية بسرعة 115200 على سلك واحد إلى RXD (الطرف 10).</text><text x="1760" y="780" font-size="15" fill="#8a8a8a" text-anchor="start" direction="rtl" unicode-bidi="embed">• تأكد من دليل Adafruit للوحة 4754 أن خرج RVC هو طرف SDA في لوحتك، وأن P0 يوصل إلى 3V3.</text><text x="1760" y="820" font-size="15" fill="#222" text-anchor="start" direction="rtl" unicode-bidi="embed">• MPU-6050: الميل (roll/pitch) من الجاذبية، والجيروسكوب يكشف أي اهتزاز أو حركة للحامل. العنوان 0x68.</text><text x="1760" y="860" font-size="15" fill="#222" text-anchor="start" direction="rtl" unicode-bidi="embed">• ثبّت BNO085 بإحكام على الكرة ومحاوره موازية لـ x,y,z، وMPU-6050 على القاعدة الثابتة وليس على الأجزاء المتحركة.</text><text x="1760" y="900" font-size="15" fill="#222" text-anchor="start" direction="rtl" unicode-bidi="embed">• أبعد البوصلتين 10–15 سم على الأقل عن السيرفوهات وأسلاك تغذيتها، واجعل أسلاك I2C أقصر من 1 م.</text><text x="1760" y="940" font-size="15" fill="#d62728" text-anchor="start" font-weight="bold" direction="rtl" unicode-bidi="embed">• التغذية 3.3V فقط من الباي (الطرفان 1 و17)، وليس 5V.</text></svg>