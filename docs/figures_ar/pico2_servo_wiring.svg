<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1210" viewBox="0 0 1800 1210" font-family="DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="#fff"/><text x="900" y="48" font-size="30" fill="#222" text-anchor="middle" font-weight="bold" direction="rtl" unicode-bidi="embed">مخطط توصيل البيكو 2: أربعة سيرفوهات MG995 (رأسان)</text><text x="900" y="82" font-size="17" fill="#8a8a8a" text-anchor="middle">Pico 2 wiring – upper head (GP16 pan, GP17 tilt) and inverted lower head (GP18 pan, GP19 tilt)</text><rect x="60" y="150" width="270" height="250" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/><text x="195" y="138" font-size="18" fill="#1b5e20" text-anchor="middle" font-weight="bold" direction="rtl" unicode-bidi="embed">Raspberry Pi Pico (البيكو 2)</text><text x="80" y="205" font-size="13" fill="#8a8a8a" text-anchor="start">pin 21</text><text x="312" y="205" font-size="15" fill="#c2185b" text-anchor="end" font-weight="bold">GP16</text><rect x="322" y="194" width="12" height="12" rx="2" fill="#c2185b" stroke="#c2185b" stroke-width="1.6"/><text x="80" y="245" font-size="13" fill="#8a8a8a" text-anchor="start">pin 22</text><text x="312" y="245" font-size="15" fill="#c2185b" text-anchor="end" font-weight="bold">GP17</text><rect x="322" y="234" width="12" height="12" rx="2" fill="#c2185b" stroke="#c2185b" stroke-width="1.6"/><text x="80" y="285" font-size="13" fill="#8a8a8a" text-anchor="start">pin 23</text><text x="312" y="285" font-size="15" fill="#222" text-anchor="end" font-weight="bold">GND</text><rect x="322" y="274" width="12" height="12" rx="2" fill="#222" stroke="#222" stroke-width="1.6"/><text x="80" y="325" font-size="13" fill="#8a8a8a" text-anchor="start">pin 24</text><text x="312" y="325" font-size="15" fill="#c2185b" text-anchor="end" font-weight="bold">GP18</text><rect x="322" y="314" width="12" height="12" rx="2" fill="#c2185b" stroke="#c2185b" stroke-width="1.6"/><text x="80" y="365" font-size="13" fill="#8a8a8a" text-anchor="start">pin 25</text><text x="312" y="365" font-size="15" fill="#c2185b" text-anchor="end" font-weight="bold">GP19</text><rect x="322" y="354" width="12" height="12" rx="2" fill="#c2185b" stroke="#c2185b" stroke-width="1.6"/><text x="195" y="430" font-size="13" fill="#8a8a8a" text-anchor="middle" direction="rtl" unicode-bidi="embed">USB إلى الباي (البيانات والكهرباء)</text><text x="1300" y="135" font-size="18" fill="#c2185b" text-anchor="middle" font-weight="bold" direction="rtl" unicode-bidi="embed">الرأس العلوي — نصف الكرة العلوي (الكاميرا 1)</text><rect x="700" y="150" width="240" height="120" rx="10" fill="#fce4ec" stroke="#c2185b" stroke-width="2"/><text x="820" y="180" font-size="16" fill="#c2185b" text-anchor="middle" font-weight="bold" direction="rtl" unicode-bidi="embed">سيرفو Tilt العلوي</text><text x="820" y="204" font-size="13" fill="#222" text-anchor="middle" direction="rtl" unicode-bidi="embed">يحرّك الكاميرا رأسياً</text><text x="820" y="226" font-size="12" fill="#ff8c00" text-anchor="middle" direction="rtl" unicode-bidi="embed">إشارة: برتقالي</text><text x="820" y="242" font-size="12" fill="#d62728" text-anchor="middle" direction="rtl" unicode-bidi="embed">+5V: أحمر</text><text x="820" y="258" font-size="12" fill="#6d4c41" text-anchor="middle" direction="rtl" unicode-bidi="embed">GND: بني</text><rect x="1000" y="150" width="240" height="120" rx="10" fill="#fce4ec" stroke="#c2185b" stroke-width="2"/><text x="1120" y="180" font-size="16" fill="#c2185b" text-anchor="middle" font-weight="bold" direction="rtl" unicode-bidi="embed">سيرفو Pan العلوي</text><text x="1120" y="204" font-size="13" fill="#222" text-anchor="middle" direction="rtl" unicode-bidi="embed">يدور أفقياً (x,y)</text><text x="1120" y="226" font-size="12" fill="#ff8c00" text-anchor="middle" direction="rtl" unicode-bidi="embed">إشارة: برتقالي</text><text x="1120" y="242" font-size="12" fill="#d62728" text-anchor="middle" direction="rtl" unicode-bidi="embed">+5V: أحمر</text><text x="1120" y="258" font-size="12" fill="#6d4c41" text-anchor="middle" direction="rtl" unicode-bidi="embed">GND: بني</text><polyline points="620,330 1450,330" fill="none" stroke="#b23c00" stroke-width="3.4" stroke-linejoin="round"/><polyline points="620,370 1450,370" fill="none" stroke="#222" stroke-width="3.4" stroke-linejoin="round"/><text x="628" y="322" font-size="13" fill="#b23c00" text-anchor="start" font-weight="bold">+5V</text><text x="628" y="388" font-size="13" fill="#222" text-anchor="start" font-weight="bold">GND</text><rect x="1450" y="290" width="280" height="100" rx="10" fill="#fff3e0" stroke="#b23c00" stroke-width="2"/><text x="1590" y="322" font-size="16" fill="#b23c00" text-anchor="middle" font-weight="bold" direction="rtl" unicode-bidi="embed">مزوّد الرأس العلوي</text><text x="1590" y="348" font-size="15" fill="#b23c00" text-anchor="middle" font-weight="bold">5V / 5A</text><text x="1590" y="372" font-size="12" fill="#8a8a8a" text-anchor="middle" direction="rtl" unicode-bidi="embed">+5V (أعلى) · GND (أسفل)</text><circle cx="1400" cy="330" r="5" fill="#b23c00" stroke="none" stroke-width="1"/><circle cx="1400" cy="370" r="5" fill="#222" stroke="none" stroke-width="1"/><polyline points="1400,330 1400,345.0" fill="none" stroke="#b23c00" stroke-width="2" stroke-linejoin="round"/><polyline points="1387,345.0 1413,345.0" fill="none" stroke="#222" stroke-width="3" stroke-linejoin="round"/><polyline points="1387,354.0 1413,354.0" fill="none" stroke="#222" stroke-width="3" stroke-linejoin="round"/><polyline points="1400,354.0 1400,370" fill="none" stroke="#222" stroke-width="2" stroke-linejoin="round"/><text x="1382" y="355.0" font-size="12" fill="#222" text-anchor="end" font-weight="bold">1000µF</text><polyline points="860,270 860,330" fill="none" stroke="#b23c00" stroke-width="2.6" stroke-linejoin="round"/><circle cx="860" cy="330" r="5" fill="#b23c00" stroke="none" stroke-width="1"/><polyline points="900,270 900,370" fill="none" stroke="#6d4c41" stroke-width="2.6" stroke-linejoin="round"/><circle cx="900" cy="370" r="5" fill="#222" stroke="none" stroke-width="1"/><polyline points="1160,270 1160,330" fill="none" stroke="#b23c00" stroke-width="2.6" stroke-linejoin="round"/><circle cx="1160" cy="330" r="5" fill="#b23c00" stroke="none" stroke-width="1"/><polyline points="1200,270 1200,370" fill="none" stroke="#6d4c41" stroke-width="2.6" stroke-linejoin="round"/><circle cx="1200" cy="370" r="5" fill="#222" stroke="none" stroke-width="1"/><polyline points="334,240 700,240" fill="none" stroke="#c2185b" stroke-width="2.6" stroke-linejoin="round"/><circle cx="700" cy="240" r="4" fill="#c2185b" stroke="none" stroke-width="1"/><polyline points="334,200 560,200 560,125 1060,125 1060,150" fill="none" stroke="#c2185b" stroke-width="2.6" stroke-linejoin="round"/><circle cx="1060" cy="150" r="4" fill="#c2185b" stroke="none" stroke-width="1"/><text x="1300" y="530" font-size="18" fill="#c2185b" text-anchor="middle" font-weight="bold" direction="rtl" unicode-bidi="embed">الرأس السفلي (مقلوب) — نصف الكرة السفلي (الكاميرا 2)</text><polyline points="620,560 1450,560" fill="none" stroke="#222" stroke-width="3.4" stroke-linejoin="round"/><polyline points="620,600 1450,600" fill="none" stroke="#b23c00" stroke-width="3.4" stroke-linejoin="round"/><text x="628" y="552" font-size="13" fill="#222" text-anchor="start" font-weight="bold">GND</text><text x="628" y="618" font-size="13" fill="#b23c00" text-anchor="start" font-weight="bold">+5V</text><rect x="1450" y="545" width="280" height="100" rx="10" fill="#fff3e0" stroke="#b23c00" stroke-width="2"/><text x="1590" y="577" font-size="16" fill="#b23c00" text-anchor="middle" font-weight="bold" direction="rtl" unicode-bidi="embed">مزوّد الرأس السفلي</text><text x="1590" y="603" font-size="15" fill="#b23c00" text-anchor="middle" font-weight="bold">5V / 5A</text><text x="1590" y="627" font-size="12" fill="#8a8a8a" text-anchor="middle" direction="rtl" unicode-bidi="embed">+5V (أعلى) · GND (أسفل)</text><circle cx="1400" cy="600" r="5" fill="#b23c00" stroke="none" stroke-width="1"/><circle cx="1400" cy="560" r="5" fill="#222" stroke="none" stroke-width="1"/><polyline points="1400,600 1400,575.0" fill="none" stroke="#b23c00" stroke-width="2" stroke-linejoin="round"/><polyline points="1387,575.0 1413,575.0" fill="none" stroke="#222" stroke-width="3" stroke-linejoin="round"/><polyline points="1387,584.0 1413,584.0" fill="none" stroke="#222" stroke-width="3" stroke-linejoin="round"/><polyline points="1400,584.0 1400,560" fill="none" stroke="#222" stroke-width="2" stroke-linejoin="round"/><text x="1382" y="585.0" font-size="12" fill="#222" text-anchor="end" font-weight="bold">1000µF</text><rect x="700" y="650" width="240" height="120" rx="10" fill="#fce4ec" stroke="#c2185b" stroke-width="2"/><text x="820" y="680" font-size="16" fill="#c2185b" text-anchor="middle" font-weight="bold" direction="rtl" unicode-bidi="embed">سيرفو Pan السفلي</text><text x="820" y="704" font-size="13" fill="#222" text-anchor="middle" direction="rtl" unicode-bidi="embed">يدور أفقياً (x,y)</text><text x="820" y="726" font-size="12" fill="#ff8c00" text-anchor="middle" direction="rtl" unicode-bidi="embed">إشارة: برتقالي</text><text x="820" y="742" font-size="12" fill="#d62728" text-anchor="middle" direction="rtl" unicode-bidi="embed">+5V: أحمر</text><text x="820" y="758" font-size="12" fill="#6d4c41" text-anchor="middle" direction="rtl" unicode-bidi="embed">GND: بني</text><rect x="1000" y="650" width="240" height="120" rx="10" fill="#fce4ec" stroke="#c2185b" stroke-width="2"/><text x="1120" y="680" font-size="16" fill="#c2185b" text-anchor="middle" font-weight="bold" direction="rtl" unicode-bidi="embed">سيرفو Tilt السفلي</text><text x="1120" y="704" font-size="13" fill="#222" text-anchor="middle" direction="rtl" unicode-bidi="embed">يحرّك الكاميرا رأسياً</text><text x="1120" y="726" font-size="12" fill="#ff8c00" text-anchor="middle" direction="rtl" unicode-bidi="embed">إشارة: برتقالي</text><text x="1120" y="742" font-size="12" fill="#d62728" text-anchor="middle" direction="rtl" unicode-bidi="embed">+5V: أحمر</text><text x="1120" y="758" font-size="12" fill="#6d4c41" text-anchor="middle" direction="rtl" unicode-bidi="embed">GND: بني</text><polyline points="860,650 860,600" fill="none" stroke="#b23c00" stroke-width="2.6" stroke-linejoin="round"/><circle cx="860" cy="600" r="5" fill="#b23c00" stroke="none" stroke-width="1"/><polyline points="900,650 900,560" fill="none" stroke="#6d4c41" stroke-width="2.6" stroke-linejoin="round"/><circle cx="900" cy="560" r="5" fill="#222" stroke="none" stroke-width="1"/><polyline points="1160,650 1160,600" fill="none" stroke="#b23c00" stroke-width="2.6" stroke-linejoin="round"/><circle cx="1160" cy="600" r="5" fill="#b23c00" stroke="none" stroke-width="1"/><polyline points="1200,650 1200,560" fill="none" stroke="#6d4c41" stroke-width="2.6" stroke-linejoin="round"/><circle cx="1200" cy="560" r="5" fill="#222" stroke="none" stroke-width="1"/><polyline points="334,320 500,320 500,700 700,700" fill="none" stroke="#c2185b" stroke-width="2.6" stroke-linejoin="round"/><circle cx="700" cy="700" r="4" fill="#c2185b" stroke="none" stroke-width="1"/><polyline points="334,360 460,360 460,820 1060,820 1060,770" fill="none" stroke="#c2185b" stroke-width="2.6" stroke-linejoin="round"/><circle cx="1060" cy="770" r="4" fill="#c2185b" stroke="none" stroke-width="1"/><polyline points="334,280 590,280 590,370 620,370" fill="none" stroke="#222" stroke-width="2.6" stroke-linejoin="round" stroke-dasharray="8,5"/><polyline points="590,370 590,560 620,560" fill="none" stroke="#222" stroke-width="2.6" stroke-linejoin="round" stroke-dasharray="8,5"/><circle cx="590" cy="370" r="4" fill="#222" stroke="none" stroke-width="1"/><text x="600" y="470" font-size="13" fill="#222" text-anchor="end" font-weight="bold" direction="rtl" unicode-bidi="embed">أرضي مشترك</text><text x="450" y="232" font-size="13" fill="#c2185b" text-anchor="middle" font-weight="bold">GP17 → upper tilt</text><text x="450" y="117" font-size="13" fill="#c2185b" text-anchor="middle" font-weight="bold">GP16 → upper pan</text><text x="600" y="692" font-size="13" fill="#c2185b" text-anchor="middle" font-weight="bold">GP18 → lower pan</text><text x="760" y="840" font-size="13" fill="#c2185b" text-anchor="middle" font-weight="bold">GP19 → lower tilt</text><polyline points="40,880 1760,880" fill="none" stroke="#ddd" stroke-width="2" stroke-linejoin="round"/><text x="1760" y="912" font-size="17" fill="#222" text-anchor="start" font-weight="bold" direction="rtl" unicode-bidi="embed">كيف يُحوَّل الاتجاه (السمت az، الارتفاع el) إلى زوايا السيرفو:</text><text x="60" y="950" font-size="15" fill="#222" text-anchor="start">upper head (el ≥ 0):  az in [0,180):  pan = az,  tilt = el   |   az in [180,360):  pan = az − 180,  tilt = 180 − el</text><text x="60" y="978" font-size="15" fill="#222" text-anchor="start">lower head (inverted, el &lt; 0):  az' = −az,  el' = −el,  then the same rule with az', el'</text><text x="60" y="1006" font-size="15" fill="#8a8a8a" text-anchor="start">tilt 0° = horizontal along the pan direction, 90° = straight up (down for the lower head), 180° = horizontal behind</text><text x="1760" y="1050" font-size="15" fill="#222" text-anchor="start" direction="rtl" unicode-bidi="embed">• اختيار الرأس: الارتفاع فوق +5° للعلوي، وتحت −5° للسفلي، وبينهما يبقى الرأس الحالي (حتى لا يتذبذب عند الأفق).</text><text x="1760" y="1078" font-size="15" fill="#222" text-anchor="start" direction="rtl" unicode-bidi="embed">• المعايرة تحدد إزاحة الصفر واتجاه دوران كل رأس؛ الرأس المقلوب يدور فيه Pan بالعكس.</text><text x="1760" y="1106" font-size="15" fill="#222" text-anchor="start" direction="rtl" unicode-bidi="embed">• كل MG995 قد يسحب 2–2.5A عند البدء: مزوّد 5V/5A لكل رأس، وأسلاك تغذية سميكة.</text><text x="1760" y="1134" font-size="15" fill="#d62728" text-anchor="start" font-weight="bold" direction="rtl" unicode-bidi="embed">• لا تُوصل 5V بأي طرف في البيكو؛ الإشارة 3.3V من البيكو تكفي عادةً لـ MG995.</text></svg>