مج)</text><line x1="780" y1="313" x2="840" y2="235" stroke="#c62828" stroke-width="1.6"/><circle cx="780" cy="313" r="3.5" fill="#c62828" stroke="none" stroke-width="1"/><text x="846" y="241" font-size="15" fill="#c62828" text-anchor="end" direction="rtl" unicode-bidi="embed">المعالج RP2040</text><line x1="670" y1="335" x2="650" y2="425" stroke="#c62828" stroke-width="1.6"/><circle cx="670" cy="335" r="3.5" fill="#c62828" stroke="none" stroke-width="1"/><text x="656" y="431" font-size="15" fill="#c62828" text-anchor="end" direction="rtl" unicode-bidi="embed">ضوء أخضر (LED)</text><line x1="883.9" y1="357" x2="915" y2="425" stroke="#c62828" stroke-width="1.6"/><circle cx="883.9" cy="357" r="3.5" fill="#c62828" stroke="none" stroke-width="1"/><text x="921" y="431" font-size="15" fill="#c62828" text-anchor="end" direction="rtl" unicode-bidi="embed">40 طرفاً (تُوصَّل بها الميكروفونات)</text><text x="767.5" y="495" font-size="24" fill="#222" text-anchor="middle" font-weight="bold" direction="rtl" unicode-bidi="embed">٢. لوحة البيكو: Raspberry Pi Pico</text><text x="767.5" y="528" font-size="18" fill="#e65100" text-anchor="middle" direction="rtl" unicode-bidi="embed">⏳ إن لم تكن عندك: اطلبها (4–6 دولار)</text><text x="767.5" y="556" font-size="17" fill="#555" text-anchor="middle" direction="rtl" unicode-bidi="embed">51 × 21 مم — متحكم صغير، ليس حاسوباً:</text><text x="767.5" y="580" font-size="17" fill="#555" text-anchor="middle" direction="rtl" unicode-bidi="embed">يقرأ الميكروفونات الـ12 بساعة واحدة ويرسلها بالـUSB</text><circle cx="1265.0" cy="305.0" r="35.0" fill="#1565c0" stroke="#0d3c78" stroke-width="2"/><circle cx="1265.0" cy="305.0" r="9" fill="#cfd8dc" stroke="#555" stroke-width="1"/><circle cx="1265.0" cy="305.0" r="2.5" fill="#333" stroke="none" stroke-width="1"/><circle cx="1200" cy="362" r="4" fill="#d4af37" stroke="none" stroke-width="1"/><text x="1200" y="385" font-size="10" fill="#333" text-anchor="middle">SCK</text><circle cx="1226" cy="362" r="4" fill="#d4af37" stroke="none" stroke-width="1"/><text x="1226" y="385" font-size="10" fill="#333" text-anchor="middle">SD</text><circle cx="1252" cy="362" r="4" fill="#d4af37" stroke="none" stroke-width="1"/><text x="1252" y="385" font-size="10" fill="#333" text-anchor="middle">WS</text><circle cx="1278" cy="362" r="4" fill="#d4af37" stroke="none" stroke-width="1"/><text x="1278" y="385" font-size="10" fill="#333" text-anchor="middle">L/R</text><circle cx="1304" cy="362" r="4" fill="#d4af37" stroke="none" stroke-width="1"/><text x="1304" y="385" font-size="10" fill="#333" text-anchor="middle">GND</text><circle cx="1330" cy="362" r="4" fill="#d4af37" stroke="none" stroke-width="1"/><text x="1330" y="385" font-size="10" fill="#333" text-anchor="middle">VDD</text><text x="1265.0" y="495" font-size="24" fill="#222" text-anchor="middle" font-weight="bold" direction="rtl" unicode-bidi="embed">٣. الميكروفون INMP441</text><text x="1265.0" y="528" font-size="18" fill="#e65100" text-anchor="middle" direction="rtl" unicode-bidi="embed">⏳ يصل 1 نوفمبر — 12 قطعة</text><text x="1265.0" y="556" font-size="17" fill="#555" text-anchor="middle" direction="rtl" unicode-bidi="embed">~14 مم — ميكروفون رقمي (I2S)</text><text x="1265.0" y="580" font-size="17" fill="#555" text-anchor="middle" direction="rtl" unicode-bidi="embed">فتحة الصوت في الوسط</text><line x1="60" y1="645" x2="1440" y2="645" stroke="#ddd" stroke-width="2"/><text x="750.0" y="680" font-size="24" fill="#222" text-anchor="middle" font-weight="bold" direction="rtl" unicode-bidi="embed">كيف تتصل ببعضها</text><rect x="1150" y="720" width="260" height="70" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/><text x="1280" y="763" font-size="20" fill="#222" text-anchor="middle" font-weight="bold">12 × INMP441</text><rect x="650" y="720" width="260" height="70" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/><text x="780" y="763" font-size="20" fill="#222" text-anchor="middle" font-weight="bold">Raspberry Pi Pico</text><rect x="150" y="720" width="260" height="70" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/><text x="280" y="763" font-size="20" fill="#222" text-anchor="middle" font-weight="bold" direction="rtl" unicode-bidi="embed">Raspberry Pi (الحاسوب)</text><line x1="1150" y1="755" x2="922" y2="755" stroke="#444" stroke-width="3"/><polygon points="910,755 926,747 926,763" fill="#444"/><text x="1030.0" y="741" font-size="16" fill="#444" text-anchor="middle" direction="rtl" unicode-bidi="embed">أسلاك (SCK, WS, SD, 3V3, GND)</text><line x1="650" y1="755" x2="422" y2="755" stroke="#444" stroke-width="3"/><polygon points="410,755 426,747 426,763" fill="#444"/><text x="530.0" y="741" font-size="16" fill="#444" text-anchor="middle" direction="rtl" unicode-bidi="embed">كابل USB واحد</text><text x="750.0" y="850" font-size="17" fill="#555" text-anchor="middle" direction="rtl" unicode-bidi="embed">البيكو هو «الوسيط»: الحاسوب لا يستطيع قراءة 12 ميكروفون I2S مباشرة وبتزامن تام، فيقوم البيكو بذلك ويرسل الصوت كاملاً عبر USB.</text><text x="750.0" y="880" font-size="17" fill="#555" text-anchor="middle" direction="rtl" unicode-bidi="embed">طريقة التمييز: Pico صغير بطول إصبع تقريباً، عليه زر أبيض BOOTSEL ومنفذ micro‑USB، ومكتوب عليه «Raspberry Pi Pico».</text><text x="750.0" y="910" font-size="17" fill="#c62828" text-anchor="middle" font-weight="bold" direction="rtl" unicode-bidi="embed">انتبه عند الشراء: اطلب Pico أو Pico H (معالج RP2040). البرنامج الحالي لا يعمل على Pico 2 (RP2350).</text></svg>